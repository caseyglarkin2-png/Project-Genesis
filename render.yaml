services:
  - type: web
    name: project-genesis-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    plan: free
    branch: main
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
    healthCheckPath: /
